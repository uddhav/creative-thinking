name: Semantic Release

# The release tag is cut on the merge of the bump PR, so the tagged tree
# holds its own version.
#
# It used to be cut on the feature merge, with the bump PR dispatched
# afterwards to record the tag in package.json. That order left every tag's
# tree one release behind (v2.10.0 held 2.9.0, v2.9.0 held 2.8.0), so
# serverInfo.version, the CLI's --version and any install pinned to a tag
# under-reported by one. Now every push to main runs a semantic-release dry
# run to learn the next version and asks scripts/release/release-decision.mjs
# what the push means:
#
# - package.json already equals the computed version: HEAD is the bump merge.
#   The real semantic-release run tags it and the binaries are built.
# - a releasable commit landed and no open bump PR proposes the version: the
#   bump PR is dispatched with the version and this sha.
# - package.json is AHEAD of the computed version (a hand edit): this run
#   fails loudly. A bump would be refused by the bump job's backwards guard on
#   every push, forever, with this run green.
# - otherwise nothing.
#
# The tag is only ever the value semantic-release computed itself; no version
# arithmetic happens in these workflows. A stale bump PR merged by hand cannot
# cut a wrong tag: its version no longer equals the computed one, so the push
# proposes a fresh bump instead.

on:
  push:
    branches:
      - main

# Two overlapping main runs could both decide `release`; the loser would fail
# on the tag and the github plugin would open an issue. One at a time, and
# never cancelled: a cancelled bump-merge run would lose the tag until the
# next push.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write # needed to dispatch release-binaries.yml and pr-version-bump.yml

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # semantic-release v25 requires ^22.14.0 || >= 24.10.0. Dependabot
          # bumped it from v24 in #284 and this pin stayed at 20.x, so every
          # run since exited 1 before reaching the release step.
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Run tests
        run: npm run test:run

      # The dry run needs GITHUB_TOKEN: semantic-release verifies push access
      # with `git push --dry-run` before any plugin runs. Its logger writes to
      # stdout; the script redirects that to stderr so stdout is one JSON line.
      - name: 🔍 Next release (dry run)
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: |
          NEXT_JSON=$(node scripts/release/next-release.mjs)
          echo "Dry run: $NEXT_JSON"
          echo "next_json=$NEXT_JSON" >> "$GITHUB_OUTPUT"

      - name: 🧭 Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_JSON: ${{ steps.next.outputs.next_json }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          # Labelled bump PRs on their branch prefix, as the bump job's own
          # close step finds them; `--search` is a lagging full-text index.
          # `mergeable` is read so a CONFLICTING bump PR (a lockfile merge
          # landed under it) counts as absent and the run re-dispatches.
          OPEN_PRS_JSON=$(gh pr list --state open --label release --json headRefName,title,mergeable)
          export CURRENT_VERSION OPEN_PRS_JSON
          node scripts/release/decide-release.mjs >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: ⛔ package.json ahead of the analyzer
        if: steps.decide.outputs.action == 'error'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "::error::$REASON"
          exit 1

      - name: 🚀 Release
        id: release
        if: steps.decide.outputs.action == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm ci installs husky; HUSKY=0 keeps the repo's hooks out of this
          # CI step. The release itself commits nothing (no git plugin in
          # .releaserc.json): the npm and changelog plugins only touch the
          # working tree, and `npm version` runs with --allow-same-version
          # against a package.json that already holds the version.
          HUSKY: '0'
        run: |
          npx semantic-release
          # Capture the tag semantic-release just created. git describe
          # --exact-match exits non-zero when HEAD has no tag, which after a
          # `release` decision means the run was not up to date with main
          # (another merge landed meanwhile); the next push decides again.
          if TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Released $TAG"
          else
            echo "No tag on HEAD after the release step; the next push to main decides again"
          fi

      - name: 📦 Trigger binary build
        # Tags pushed by GITHUB_TOKEN don't fire downstream `push: tags`
        # workflows by design, so dispatch release-binaries.yml explicitly.
        # Manual `git tag && git push origin v…` paths still trigger the
        # workflow directly without going through this step.
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run release-binaries.yml --ref "$TAG" -f tag="$TAG"

      # The bump PR is proposed from the dry run, BEFORE any tag exists, and
      # carries the sha it describes. Merging it is what cuts the tag (the
      # `release` branch above, on the next push). If this dispatch fails, no
      # bump PR appears and the next push to main proposes it again; nothing
      # is tagged in the meantime, which is the benign failure.
      - name: 🔖 Propose the version bump
        if: steps.decide.outputs.action == 'bump'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          gh workflow run pr-version-bump.yml \
            --ref main \
            -f tag="v$VERSION" \
            -f sha="$GITHUB_SHA"
