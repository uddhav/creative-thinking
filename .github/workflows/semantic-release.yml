name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write # needed to dispatch the release-binaries workflow after publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          # semantic-release v25 requires ^22.14.0 || >= 24.10.0. Dependabot
          # bumped it from v24 in #284 and this pin stayed at 20.x, so every
          # run since exited 1 before reaching the release step.
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Run tests
        run: npm run test:run

      - name: 🚀 Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The repo's pre-commit hook refuses commits on the main branch
          # (a guard for human contributors). semantic-release commits the
          # CHANGELOG + version bump on main; HUSKY=0 disables hooks for
          # this CI step only without touching the hook file.
          HUSKY: '0'
        run: |
          npx semantic-release
          # Capture the tag semantic-release just created (if any). git
          # describe --exact-match exits non-zero when HEAD has no tag, in
          # which case there was nothing to release this run.
          if TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Released $TAG"
          else
            echo "No release this run"
          fi

      - name: 📦 Trigger binary build
        # Tags pushed by GITHUB_TOKEN don't fire downstream `push: tags`
        # workflows by design, so dispatch release-binaries.yml explicitly.
        # Manual `git tag && git push origin v…` paths still trigger the
        # workflow directly without going through this step.
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-binaries.yml \
            --ref "${{ steps.release.outputs.tag }}" \
            -f tag="${{ steps.release.outputs.tag }}"

      - name: 🔖 Trigger version bump PR
        # The bump PR is a CONSEQUENCE of the tag, not a race against it.
        #
        # pr-version-bump.yml used to fire on the same merge as this workflow
        # and read `git describe` before semantic-release had written the new
        # tag, so it proposed the previous release's version. Four consecutive
        # bump PRs were wrong; the fourth proposed 2.4.2 while package.json
        # already held 2.4.3, which would have written the version backwards.
        # Its own comment called that "eventually correct", but the catch-up
        # only lands if the next merge does not also tag, and in a run of
        # merges it never does.
        #
        # Dispatching from here removes the race by construction: the tag
        # exists before the bump job starts, because this step cannot run until
        # the release step above has finished creating it.
        #
        # `!cancelled()` rather than a bare condition: this step follows the
        # binary-build dispatch, and a default `if:` would skip it whenever
        # that step failed. Two unrelated concerns would then share a fate — a
        # transient failure dispatching a binary build would also silently cost
        # the version bump. They both depend on the tag and on nothing else.
        if: ${{ !cancelled() && steps.release.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pr-version-bump.yml \
            --ref main \
            -f tag="${{ steps.release.outputs.tag }}"
