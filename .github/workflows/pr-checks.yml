name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  # Job 1: PR Validation
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 📝 Check PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: 📊 PR size check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;

            let size = 'XS';
            if (totalChanges > 1000) size = 'XXL';
            else if (totalChanges > 500) size = 'XL';
            else if (totalChanges > 250) size = 'L';
            else if (totalChanges > 100) size = 'M';
            else if (totalChanges > 50) size = 'S';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [`size/${size}`]
            }).catch(() => {});

            if (size === 'XXL' || size === 'XL') {
              core.warning(`This PR is ${size} (${totalChanges} changes). Consider breaking it into smaller PRs.`);
            }

      - name: 🏷️ Auto-label PR
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'

  # Job 2: Code Review Checks
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      # CodeQL's analyze step calls /repos/:owner/:repo/actions/runs/:id to
      # attach run metadata to telemetry. Without actions:read that call
      # surfaces as "Resource not accessible by integration" and fails the job
      # even when the analysis itself succeeded.
      actions: read
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # CodeQL steps are best-effort: GitHub Code Scanning requires Advanced
      # Security, which is org-only. Analysis findings still appear in the
      # action logs, but the SARIF upload will fail on personal public repos.
      # continue-on-error keeps the overall check green.
      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        continue-on-error: true
        with:
          languages: javascript-typescript

      - name: 🔨 Autobuild
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        continue-on-error: true

      - name: 🔍 Run CodeQL analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        continue-on-error: true

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage || true

      - name: 📊 Comment test coverage
        uses: romeovs/lcov-reporter-action@87a815f34ec27a5826abba44ce09bbc688da58fd # v0.4.0
        if: always() && github.event.pull_request.draft == false
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 💬 Comment PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: github.event.pull_request.draft == false
        with:
          script: |
            const output = `## 🤖 Automated PR Review

            ### 📊 Code Quality Metrics
            - **Test Coverage**: See comment above
            - **Build Status**: Check CI workflow
            - **Security Scan**: Check security job

            ### 📝 PR Checklist
            - [ ] Tests added/updated
            - [ ] Documentation updated
            - [ ] No console.logs left
            - [ ] Version bumped (if needed)
            - [ ] CHANGELOG updated (if needed)

            ### 🎯 Review Focus Areas
            - Check for proper error handling
            - Verify TypeScript types
            - Review security implications
            - Ensure consistent code style`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # Job 3: Dependency Review
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # Job 4: Preview Deployment
  preview:
    name: Preview Documentation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📚 Build documentation
        run: |
          # Generate API docs
          npx typedoc src/index.ts --out docs/api || true

          # Create PR preview info
          echo "# PR Preview for #${{ github.event.pull_request.number }}" > docs/index.html
          echo "<h2>Changed Files</h2><ul>" >> docs/index.html
          git diff --name-only origin/main..HEAD | sed 's/^/<li>/' | sed 's/$/<\/li>/' >> docs/index.html
          echo "</ul>" >> docs/index.html

      - name: 📁 Upload preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: docs/
          retention-days: 7
