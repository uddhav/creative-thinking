name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # Job 1: Linting and Code Quality
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 📊 TypeScript type checking
        run: npm run typecheck

      - name: 🎨 Check code formatting
        run: npm run format:check

  # Job 2: Test with Coverage
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Tracks the engines range in package.json. Node 18 left the matrix
        # when yargs 18 raised its floor to ^20.19; it had been EOL since
        # 2025-04-30, and the dev toolchain had already moved past it.
        node-version: ['20.x', '22.x']
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 📁 Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  # Job 3: Build Verification
  build:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x']
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 📂 Verify build output
        run: |
          for f in dist/mcp-server-main.js dist/cli.js; do
            if [ ! -f "$f" ]; then
              echo "Build failed: $f not found"
              exit 1
            fi
          done
        shell: bash

      - name: 🚀 Smoke-test the socketes CLI
        run: |
          # CLI is one-shot — --version exits 0 immediately on success.
          OUT=$(node dist/cli.js --version)
          if [ -z "$OUT" ]; then
            echo "❌ socketes CLI did not print a version"
            exit 1
          fi
          echo "✅ socketes CLI prints version: $OUT"
        shell: bash

      - name: 🚀 Smoke-test the MCP server
        run: |
          # Portable backstop without `timeout` (not in macOS coreutils, not
          # reliable in Git Bash on Windows): background the server, send
          # initialize, then SIGTERM after a short sleep. Capture output to
          # a file and grep separately so `pipefail` doesn't propagate the
          # killer's non-zero exit.
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          TMPLOG=$(mktemp)
          echo "$REQ" | node dist/mcp-server-main.js > "$TMPLOG" 2>/dev/null &
          SERVER_PID=$!
          ( sleep 5; kill -TERM $SERVER_PID 2>/dev/null ) &
          KILLER_PID=$!
          wait $SERVER_PID 2>/dev/null || true
          kill $KILLER_PID 2>/dev/null || true
          if grep -q '"protocolVersion"' "$TMPLOG"; then
            echo "✅ MCP server responded to initialize"
          else
            echo "❌ MCP server did not respond to initialize"
            echo "captured stdout:"
            cat "$TMPLOG"
            exit 1
          fi
        shell: bash

      - name: 📁 Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  # Job 4: Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --production --audit-level=high

      - name: 🔍 Run Snyk security scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # `base` must be the commit to diff FROM, and on a push to the default
      # branch `github.event.repository.default_branch` resolves to the commit
      # we just pushed — the same commit as HEAD. TruffleHog then exits 1 with
      # "BASE and HEAD commits are the same. TruffleHog won't scan anything",
      # which is what made this job red on every push to main while passing on
      # every PR, where the two genuinely differ.
      #
      # The failure read as noise for long enough that nobody chased it, and
      # the cost was not the red badge: secret scanning had never actually run
      # on main. On a push, diff from the commit the branch was at before it
      # (`github.event.before`), so the range scanned is the range pushed.
      #
      # One arm per trigger this workflow declares: a pull_request diffs against
      # the default branch as before, a push diffs against its own `before`, and
      # a workflow_dispatch — where `before` is unset — falls back to the last
      # commit. Verified by CI on this PR rather than locally; a workflow
      # expression cannot be exercised any other way.
      - name: 🔐 Check for secrets
        uses: trufflesecurity/trufflehog@0c952ace0f842f11c75775922d7400335cf60bc6 # main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.event.before || 'HEAD~1' }}
          head: HEAD

  # Job 5: Dependency Management
  dependencies:
    name: Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Check for outdated dependencies
        run: |
          npm outdated || true
          echo "::warning::Check output above for outdated dependencies"

      - name: 🔍 Check dependency licenses
        run: |
          npx license-checker --production --summary --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;GPL-3.0;GPL-3.0-or-later"
        continue-on-error: true

      - name: 📊 Analyze bundle size
        run: |
          npm run build
          echo "Build size analysis:"
          du -sh dist/ || true
          find dist -name "*.js" -exec wc -c {} + | sort -n

  # Job 6: Integration Tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Run MCP server tests
        run: |
          # Test that the server starts and responds to basic commands
          timeout 10s node dist/mcp-server-main.js || [ $? -eq 124 ]
          echo "MCP server basic startup test passed"

      - name: 🎞️ Replay ratchet (emission baseline)
        # Replays the committed fixtures through the freshly built server and
        # compares against evals/replay/baseline.json — errors, response
        # bytes, discovery picks, and the steering-emission floors must not
        # regress. Deliberately NOT a vitest test: vitest's retry:2 masks
        # intermittent failures, and test:run has no pretest build hook.
        run: npm run evals:replay

      - name: 🔄 Test with Claude Desktop configuration
        run: |
          # Validate that the tool works with Claude Desktop config format
          echo '{"mcp": {"servers": {"creative-thinking": {"command": "node", "args": ["dist/mcp-server-main.js"]}}}}' > test-config.json
          echo "Configuration validation passed"

  # Job 7: Release Preparation (only on main)
  release-prep:
    name: Release Preparation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, build, security]
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷️ Check version bump needed
        run: |
          # Check if version was bumped in this push
          git diff HEAD~1 HEAD --name-only | grep -q "package.json" && echo "Package.json changed" || echo "No version change"

      - name: 📝 Generate changelog
        run: |
          echo "## Recent Changes" > RELEASE_NOTES.md
          git log --pretty=format:"- %s (%h)" -10 >> RELEASE_NOTES.md

      - name: 📁 Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  # Final Job: Status Check
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, test, build, security, dependencies, integration]
    if: always()
    steps:
      - name: 📊 Check CI Status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "❌ CI Pipeline failed!"
            echo "Lint: ${{ needs.lint.result }}"
            echo "Test: ${{ needs.test.result }}"
            echo "Build: ${{ needs.build.result }}"
            echo "Integration: ${{ needs.integration.result }}"
            echo "Security: ${{ needs.security.result }}"
            echo "Dependencies: ${{ needs.dependencies.result }}"
            exit 1
          else
            echo "✅ CI Pipeline passed!"
          fi
