name: PR Version Bump

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-version-bump-pr:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, 'chore(release)')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # PR title and body are attacker-controlled text. They reach the shell
      # through `env:` so the runner sets them as variables; interpolating
      # `${{ github.event.pull_request.body }}` into the script body instead
      # lets backticks in any PR description run as command substitution,
      # which is what took this job down with exit 127 on every previous run.
      - name: Analyze PR and determine version bump
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMITS=$(gh pr view "$PR_NUMBER" --json commits -q '.commits[].commit.message')

          # Collect the signals first and decide once at the end. Deciding as we
          # went let a later `feat:` check overwrite an earlier major with minor,
          # so a breaking change announced in the PR body but implemented in a
          # `feat:` commit was released as a minor.
          IS_MAJOR=""
          IS_MINOR=""

          # Conventional Commits marks a breaking change with `!` before the
          # colon, or a `BREAKING CHANGE:` footer at the start of a line — never
          # in running prose. The previous unanchored `grep -qi "breaking
          # change"` matched any mention: #285 documented the detection in a
          # table and was scored 2.0.0 for what was a `fix(ci):` change.
          if printf '%s\n' "$PR_TITLE" "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:"; then
            IS_MAJOR=1
          fi

          if printf '%s\n' "$PR_BODY" "$COMMITS" | grep -qE "^BREAKING[ -]CHANGE:"; then
            IS_MAJOR=1
          fi

          if printf '%s\n' "$PR_TITLE" "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?!?:"; then
            IS_MINOR=1
          fi

          if [ -n "$IS_MAJOR" ]; then
            BUMP_TYPE="major"
          elif [ -n "$IS_MINOR" ]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Determined bump type: $BUMP_TYPE"

      - name: Create version bump branch
        run: |
          BRANCH_NAME="chore/version-bump-$(date +%Y%m%d%H%M%S)"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      # package.json mirrors the newest tag rather than being a second opinion.
      # semantic-release decides the version and publishes it; incrementing a
      # local value in parallel produced two independent estimates that drifted
      # apart -- package.json sat at 1.1.0 from May while the tags reached
      # v2.1.3, and the bump PR proposed 1.1.1 for work released as v2.1.3.
      #
      # If this job wins the race against semantic-release the tag is still the
      # previous release, package.json lands one behind, and the next merge
      # closes the gap. Eventually correct beats independently wrong.
      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ steps.analyze.outputs.bump_type }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          TAG_VERSION="${LATEST_TAG#v}"

          if [ -z "$TAG_VERSION" ]; then
            # No tags yet, so there is nothing to mirror. Fall back to the
            # Conventional Commits bump so a first release can still be cut.
            npm version "$BUMP_TYPE" --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "No tags found; bumped $CURRENT_VERSION -> $NEW_VERSION ($BUMP_TYPE)"
          elif [ "$TAG_VERSION" = "$CURRENT_VERSION" ]; then
            echo "package.json already matches the newest tag ($TAG_VERSION); nothing to do"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          else
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
            NEW_VERSION="$TAG_VERSION"
            echo "Aligned $CURRENT_VERSION -> $NEW_VERSION (newest tag $LATEST_TAG)"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT"

      - name: Generate changelog entry
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Built with printf into a file rather than accumulated into a shell
          # string: the PR title and commit subjects are untrusted text, and
          # `echo -e` on them would also expand backslash escapes they contain.
          {
            printf '## [v%s] - %s\n\n' "$NEW_VERSION" "$(date +%Y-%m-%d)"
            printf '### Changes from PR #%s\n\n' "$PR_NUMBER"
            printf -- '- %s\n' "$PR_TITLE"

            gh pr view "$PR_NUMBER" --json commits -q '.commits[].commit.message' \
              | head -5 \
              | while IFS= read -r commit; do
                  # `[ -n "$c" ] && printf` leaves the loop's exit status at 1
                  # whenever the last line read is blank, and this step runs
                  # under `bash -e`, which failed the job on every merge.
                  if [ -n "$commit" ]; then
                    printf -- '  - %s\n' "$commit"
                  fi
                done
            printf '\n'
          } > CHANGELOG.entry

          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.entry CHANGELOG.md > CHANGELOG.tmp
          else
            { printf '# Changelog\n\n'; cat CHANGELOG.entry; } > CHANGELOG.tmp
          fi
          mv CHANGELOG.tmp CHANGELOG.md
          rm -f CHANGELOG.entry

      - name: Commit changes
        if: steps.bump.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BUMP_TYPE: ${{ steps.analyze.outputs.bump_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          printf 'chore(release): bump version to %s\n\nAutomated version bump after merging PR #%s\n- %s\n- Bump type: %s\n' \
            "$NEW_VERSION" "$PR_NUMBER" "$PR_TITLE" "$BUMP_TYPE" > /tmp/bump-commit-msg
          git commit -F /tmp/bump-commit-msg

      - name: Push branch
        if: steps.bump.outputs.skip != 'true'
        run: |
          git push origin "$branch_name"

      - name: Create Pull Request
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BUMP_TYPE: ${{ steps.analyze.outputs.bump_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGED_BY: ${{ github.actor }}
        run: |
          # --body-file rather than --body: the title and login below are
          # untrusted, and building the body inline would put them back into
          # the command line this step is trying to keep them out of.
          {
            printf '## Automated Version Bump\n\n'
            printf 'This PR was automatically created after merging PR #%s.\n\n' "$PR_NUMBER"
            printf '### Version Change\n'
            printf -- '- **Bump Type**: %s\n' "$BUMP_TYPE"
            printf -- '- **New Version**: %s\n\n' "$NEW_VERSION"
            printf '### Merged PR Details\n'
            printf -- '- **Title**: %s\n' "$PR_TITLE"
            printf -- '- **Author**: @%s\n' "$PR_AUTHOR"
            printf -- '- **Merged by**: @%s\n\n' "$MERGED_BY"
            printf "### What's included\n"
            printf -- '- Updated `package.json` with new version\n'
            printf -- '- Updated `package-lock.json`\n'
            printf -- '- Updated `CHANGELOG.md` with PR details\n\n'
            printf '### Next Steps\n'
            printf '1. Review the version bump\n'
            printf '2. Merge this PR to trigger the release workflow\n'
            printf '3. A GitHub release will be created automatically\n\n'
            printf -- '---\n'
            printf '*This is an automated PR. Please review before merging.*\n'
          } > /tmp/bump-pr-body.md

          gh pr create \
            --title "chore(release): bump version to $NEW_VERSION" \
            --body-file /tmp/bump-pr-body.md \
            --base main \
            --head "$branch_name" \
            --label "release" \
            --label "automated"
