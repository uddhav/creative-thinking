name: Release Binaries

# Builds standalone executables for socketes (CLI) on tag push and uploads
# them to the GitHub Release. Per-platform runners build their native targets;
# Bun's macOS-to-Linux cross-compile has been observed to hang while
# downloading the Linux runtime, so each runner builds only its own platform.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.7.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write # to create releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:bin:darwin
            artifact-name: socketes-darwin
          - os: ubuntu-latest
            script: build:bin:linux
            artifact-name: socketes-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.18'

      - name: Install deps
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build standalone binaries for this platform
        run: npm run ${{ matrix.script }}

      - name: List artifacts
        working-directory: dist/bin
        run: ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/bin/socketes-*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/bin
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist/bin
        run: |
          shasum -a 256 socketes-* > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading binaries"
            gh release upload "$TAG" dist/bin/socketes-* dist/bin/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Standalone \`socketes\` binaries for macOS and Linux. Verify with \`shasum -a 256 -c SHA256SUMS\`. See [SOCKETES.md](https://github.com/${{ github.repository }}/blob/main/SOCKETES.md#install) for install + Gatekeeper bypass." \
              dist/bin/socketes-* dist/bin/SHA256SUMS
          fi
